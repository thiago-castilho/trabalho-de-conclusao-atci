name: Execução de Pipeline de Testes

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Instalando dependências
        run: npm install

      - name: Execução dos testes automatizados
        run: npm run test:ci

      - name: Salvando relatório do Cypress
        run: npm run test:ci

      - name: Upload relatório do Cypress
        uses: actions/upload-artifact@v6
        if: always()
        with:
          path: ./cypress-mochawesome-reporter
          name: relatorio-de-testes-automatizados-${{ github.run_number }}
